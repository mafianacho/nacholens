name: Bug report
description: Something produced a wrong page, a wrong overlay or an error
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The command you ran. If it needs a repository, name a public one (commit SHA please) or use `nacholens demo`.
      render: shell
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: nacholens version and Node version
      placeholder: "0.3.4, node v24.18.1"
    validations: { required: true }
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [scan, model validation / verify, diff overlay, player (page), install, docs / skill, other]
    validations: { required: true }
  - type: textarea
    id: extra
    attributes:
      label: Screenshot or output (remove anything private)

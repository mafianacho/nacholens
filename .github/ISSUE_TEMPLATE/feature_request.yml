name: Feature request
description: A stack, a diagram element or a workflow nacholens does not cover yet
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to understand or show?
      description: Describe the situation, not the solution.
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: What would you like it to do?
  - type: input
    id: stack
    attributes:
      label: Stack involved (language, framework, gateway, database)

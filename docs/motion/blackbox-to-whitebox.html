<!--

  Open it with ?lang=en or ?lang=ko; ?t=7.5 shows one still frame.
  Frames are captured and encoded by render.mjs / encode.py (see README.md in this folder).
  Palette and type roles: the Nacho Combo design system, as used in src/player/player.css
  (paper / nacho / guac / salsa / board tokens; Nacho Sans for text, Anton only for the one loud line).
-->

  @font-face { font-family: "Nacho Sans"; font-weight: 500; src: url("../../src/player/fonts/nacho-sans-500.woff2") format("woff2"); }

  svg { display: block; }
  text { font-family: "Nacho Sans", "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", "Noto Sans CJK KR", system-ui, sans-serif; }
  .mono { font-family: "Nacho Mono", ui-monospace, "Noto Sans Mono CJK KR", monospace; }
  .anton { font-family: "Anton", "Nacho Sans", sans-serif; }
</style>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"></svg>
<script>
(() => {
const W = 960, H = 540, DURATION = 17.5;   // seconds shown; scene times below are "scene seconds" (0..15.5)
const lang = new URLSearchParams(location.search).get("lang") === "ko" ? "ko" : "en";

// ---- Nacho Combo tokens (same values as src/player/player.css, section 1a)
const K = {
  paper: "#FFFFFF", paper2: "#FFF7E1", line: "#EBDDBF", ink: "#24180D", ink2: "#66553F",
  nacho: "#FFC43D", nachoDeep: "#E48A0C", nachoInk: "#9A5A00", onNacho: "#2A1A0B", guac: "#377F33", salsa: "#BE3B24",
  board: "#1E1610", board2: "#2B2017", boardLine: "#45352A", boardInk: "#FFF1D2", boardMute: "#BFA889", boardSalsa: "#F38069", boardGuac: "#7FCB72"
};

const STR = {
  en: {
    before: "BEFORE", beforeTitle: "AI coding agents are a black box",
    after: "AFTER", afterTitle: "nacholens turns it into a white box",
    you: "You", ask: "Show shipping status\non the order list",
    agent: "AI agent", blackbox: "Can't see inside",
    files: "23 files changed",
    q1: "What did it touch?", q2: "Any new outside calls?", q3: "What should I re-test?",
    cap: "You can't see inside. Checking 23 files means reading code.",
    legend: "Highlighted from git diff:  yellow = changed,  green = new",
    steps: [
      "Browser asks for the order list",
      "Gateway checks the session",
      "Order API reads the user's orders from SQLite",
      "Order API asks the shipping tracker for each order",
      "Order API builds the reply with the status",
      "Browser shows the list with delivery status"
    ],
    changed: "Changed", isNew: "New",
    nodes: { browser: ["Browser", "Client"], gateway: ["Gateway", "Entry point"], api: ["Order API", "Service"],
             db: ["SQLite", "Data store"], track: ["Shipping tracker", "External service"], ana: ["Analytics", "External service"] },
    a1: "2 parts changed, 1 new", s1: "Browser, Order API, Shipping tracker",
    a2: "Yes: Shipping tracker", s2: "One lookup per order",
    a3: "Re-test these 2 flows", s3: "List my orders, Place an order",
    black: "Black box", white: "White box",
    loud1: "SEE WHAT YOUR AI CHANGED.", loud2: "NO CODE READING.", loudSize: 56,
    tag3: "Pick a use case, watch the request move, see the changed parts.",
    brand: "Made by Mafianacho Inc."
  },
  ko: {
    before: "BEFORE", beforeTitle: "AI 에이전틱 코딩은 블랙박스입니다",
    after: "AFTER", afterTitle: "nacholens가 화이트박스로 바꿉니다",
    you: "나", ask: "주문 목록에\n배송 상태를 보여줘",
    agent: "AI 에이전트", blackbox: "안이 보이지 않음",
    files: "파일 23개 변경",
    q1: "뭘 건드렸지?", q2: "새 외부 호출은 없나?", q3: "뭘 다시 테스트하지?",
    cap: "안을 볼 수 없습니다. 파일 23개를 확인하려면 코드를 읽어야 합니다.",
    legend: "git diff로 강조:  노랑 = 변경,  초록 = 새로 추가",
    steps: [
      "브라우저가 주문 목록을 요청",
      "게이트웨이가 세션을 확인",
      "주문 API가 SQLite에서 주문을 읽음",
      "주문 API가 주문마다 배송 추적기에 문의",
      "주문 API가 배송 상태를 넣어 응답을 만듦",
      "브라우저가 배송 상태와 함께 목록을 표시"
    ],
    changed: "변경", isNew: "신규",
    nodes: { browser: ["브라우저", "클라이언트"], gateway: ["게이트웨이", "진입점"], api: ["주문 API", "서비스"],
             db: ["SQLite", "데이터 저장소"], track: ["배송 추적기", "외부 서비스"], ana: ["분석 도구", "외부 서비스"] },
    a1: "2곳 변경, 1곳 신규", s1: "브라우저, 주문 API, 배송 추적기",
    a2: "있음: 배송 추적기", s2: "주문마다 1회 조회",
    a3: "다시 볼 흐름 2개", s3: "내 주문 보기, 주문하기",
    black: "블랙박스", white: "화이트박스",
    loud1: "AI가 바꾼 것을 눈으로 확인하세요.", loud2: "코드를 읽을 필요가 없습니다.", loudSize: 42,
    tag3: "유즈케이스를 고르면 요청이 움직이고 바뀐 곳이 강조됩니다.",
    brand: "Made by Mafianacho Inc."
  }
}[lang];

const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("stage");
const ups = [];                       // per-frame updaters
const fits = [];                      // [text element, max width]: shrunk after fonts load so nothing leaves its box
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = p => 1 - Math.pow(1 - p, 3);
const eio = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const back = p => { const c = 1.7; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const lerp = (a, b, p) => a + (b - a) * p;

function el(tag, attrs = {}, parent = svg) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  parent.appendChild(e);
  return e;
}
function g(parent, attrs = {}) { return el("g", attrs, parent); }
function text(parent, x, y, str, o = {}) {
  const t = el("text", { x, y, "font-size": o.size || 16, "font-weight": o.weight || 500, fill: o.fill || K.ink, "text-anchor": o.anchor || "start" }, parent);
  if (o.cls) t.setAttribute("class", o.cls);
  String(str).split("\n").forEach((line, i) => {
    const s = el("tspan", { x, dy: i === 0 ? 0 : (o.lh || (o.size || 16) * 1.3) }, t);
    s.textContent = line;
  });
  if (o.fit) fits.push([t, o.fit]);
  return t;
}
function rect(parent, x, y, w, h, o = {}) {
  return el("rect", { x, y, width: w, height: h, rx: o.rx ?? 0, fill: o.fill || "none", ...(o.stroke ? { stroke: o.stroke, "stroke-width": o.sw || 2 } : {}), ...(o.extra || {}) }, parent);
}
function reveal(node, a, b, dy = 10) {
  ups.push(t => {
    const p = eo(seg(t, a, b));
    node.setAttribute("opacity", p);
    node.setAttribute("transform", `translate(0 ${(1 - p) * dy})`);
  });
}
function windowed(node, a, b, f = .12) {
  ups.push(t => node.setAttribute("opacity", Math.min(seg(t, a, a + f), 1 - seg(t, b - f, b))));
}

// ---- line icons (24 x 24 grid, round caps, drawn as strokes: one family, one weight)
const ICONS = {
  user: ['<circle cx="12" cy="8" r="4"/>', '<path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>'],
  sparkles: ['<path d="M11 3l2 5.4L18.4 10.4 13 12.4 11 17.8 9 12.4 3.6 10.4 9 8.4z"/>', '<path d="M19 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/>'],
  eyeOff: ['<path d="M3 3l18 18"/>', '<path d="M10.6 5.1A9.7 9.7 0 0 1 12 5c5.2 0 8.6 4 9.6 7a13 13 0 0 1-2.3 3.5"/>', '<path d="M6.5 6.6C4.3 8 2.9 10 2.4 12c1 3 4.4 7 9.6 7 1.6 0 3-.4 4.2-1"/>', '<path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>'],
  eye: ['<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/>', '<circle cx="12" cy="12" r="3"/>'],
  files: ['<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/>', '<path d="M14 3v5h5"/>', '<path d="M9 13h6M12 10v6M9 19h6"/>'],
  help: ['<circle cx="12" cy="12" r="9.5"/>', '<path d="M9.2 9.2a3 3 0 0 1 5.8 1c0 2-3 2.6-3 4.3"/>', '<path d="M12 17.4h.01"/>'],
  window: ['<rect x="3" y="4" width="18" height="16" rx="2.5"/>', '<path d="M3 9h18"/>', '<path d="M6.5 6.5h.01M9 6.5h.01"/>'],
  shield: ['<path d="M12 3l8 3v6c0 5-3.4 8-8 9-4.6-1-8-4-8-9V6z"/>', '<path d="M8.8 12l2.2 2.2 4.2-4.4"/>'],
  server: ['<rect x="3" y="3.5" width="18" height="7" rx="2"/>', '<rect x="3" y="13.5" width="18" height="7" rx="2"/>', '<path d="M7 7h.01M7 17h.01M12 7h5M12 17h5"/>'],
  database: ['<ellipse cx="12" cy="5.5" rx="8.5" ry="3"/>', '<path d="M3.5 5.5v13c0 1.7 3.8 3 8.5 3s8.5-1.3 8.5-3v-13"/>', '<path d="M3.5 12c0 1.7 3.8 3 8.5 3s8.5-1.3 8.5-3"/>'],
  truck: ['<path d="M14 17V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v10a1 1 0 0 0 1 1h2"/>', '<path d="M14 17H9"/>', '<path d="M14 8h4l4 4v4a1 1 0 0 1-1 1h-2"/>', '<circle cx="7" cy="17.5" r="2"/>', '<circle cx="17" cy="17.5" r="2"/>'],
  chart: ['<path d="M3.5 3.5V20.5H20.5"/>', '<path d="M8 16v-5M12.5 16V7M17 16v-8"/>'],
  check: ['<path d="M5 12.5l4.5 4.5L19 7"/>'],
  arrow: ['<path d="M4 12h15M13 6l6 6-6 6"/>'],
  search: ['<circle cx="10.5" cy="10.5" r="6.5"/>', '<path d="M21 21l-5.2-5.2"/>'],
  lock: ['<rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/>', '<path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>'],
  terminal: ['<path d="M4 6l6 6-6 6M12.5 19H20"/>'],
  chat: ['<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H11l-5 4v-4h-0A2.5 2.5 0 0 1 4 13.5z"/>']
};
function icon(parent, name, cx, cy, size, color, sw = 1.8) /* sw in screen px */ {
  const grp = g(parent, { transform: `translate(${cx - size / 2} ${cy - size / 2}) scale(${size / 24})`, fill: "none", stroke: color, "stroke-width": sw * 24 / size, "stroke-linecap": "round", "stroke-linejoin": "round" });
  grp.innerHTML = ICONS[name].join("");
  return grp;
}

// ---- defs
const defs = el("defs");
const dots = el("pattern", { id: "dots", width: 24, height: 24, patternUnits: "userSpaceOnUse" }, defs);
el("circle", { cx: 2, cy: 2, r: 1.1, fill: K.line }, dots);
const blur = el("filter", { id: "glow", x: "-50%", y: "-60%", width: "200%", height: "220%" }, defs);
el("feGaussianBlur", { stdDeviation: 10 }, blur);
const glowA = el("radialGradient", { id: "warm", cx: "50%", cy: "50%", r: "55%" }, defs);
el("stop", { offset: "0", "stop-color": K.nacho, "stop-opacity": .13 }, glowA);
el("stop", { offset: "1", "stop-color": K.nacho, "stop-opacity": 0 }, glowA);
const clipA = el("clipPath", { id: "clipA" }, defs);
const clipARect = el("rect", { x: 0, y: 0, width: W, height: H }, clipA);
const boxClip = el("clipPath", { id: "boxClip" }, defs);
el("rect", { x: 342, y: 196, width: 266, height: 140, rx: 8 }, boxClip);

function logo(parent, x, y, dark) {
  const b = g(parent, { transform: `translate(${x} ${y})` });
  rect(b, 0, 0, 30, 30, { rx: 7, fill: K.nacho });
  text(b, 15, 24, "N", { size: 25, anchor: "middle", fill: K.onNacho, cls: "anton", weight: 400 });
  text(b, 40, 24, "NACHOLENS", { size: 25, fill: dark ? K.boardInk : K.ink, cls: "anton", weight: 400 });
}
function chip(parent, x, y, label, fill, color, w) {
  rect(parent, x, y, w, 30, { rx: 7, fill });
  text(parent, x + w / 2, y + 20.5, label, { size: 14, weight: 700, fill: color, anchor: "middle" });
}

// ============================================================ scene C (white box, below)
const C = g(svg);
rect(C, 0, 0, W, H, { fill: K.paper });
rect(C, 0, 0, W, H, { fill: "url(#dots)" });
rect(C, 0, 0, W, 60, { fill: K.paper });
rect(C, 0, 60, W, 1.5, { fill: K.line });
{
  chip(C, 32, 15, STR.after, K.guac, "#fff", 76);
  text(C, 124, 38, STR.afterTitle, { size: 21, weight: 600, fill: K.ink });
  logo(C, 720, 15, false);
}

const NODE = {
  browser: { x: 30, y: 236, w: 160, icon: "window" }, gateway: { x: 252, y: 236, w: 160, icon: "shield" }, api: { x: 474, y: 236, w: 160, icon: "server" },
  db: { x: 730, y: 142, w: 200, icon: "database" }, track: { x: 730, y: 236, w: 200, icon: "truck" }, ana: { x: 730, y: 330, w: 200, icon: "chart" }
};
const NH = 68, MID = 236 + NH / 2;
const edges = {
  e1: `M190 ${MID} L252 ${MID}`, e2: `M412 ${MID} L474 ${MID}`,
  e3: `M634 ${MID} C 690 ${MID} 680 ${142 + NH / 2} 730 ${142 + NH / 2}`, e4: `M634 ${MID} L730 ${MID}`, e5: `M634 ${MID} C 690 ${MID} 680 ${330 + NH / 2} 730 ${330 + NH / 2}`
};
const edgeEnd = { e1: [252, MID], e2: [474, MID], e3: [730, 142 + NH / 2], e4: [730, MID], e5: [730, 330 + NH / 2] };
const edgeBase = {}, edgeLit = {};
for (const [k, d] of Object.entries(edges)) {
  edgeBase[k] = el("path", { d, fill: "none", stroke: "#C7AE78", "stroke-width": 3, "stroke-linecap": "round" }, C);
  el("path", { d: `M${edgeEnd[k][0] - 8} ${edgeEnd[k][1] - 6} L${edgeEnd[k][0]} ${edgeEnd[k][1]} L${edgeEnd[k][0] - 8} ${edgeEnd[k][1] + 6}`, fill: "none", stroke: "#C7AE78", "stroke-width": 3, "stroke-linecap": "round", "stroke-linejoin": "round" }, C);
}
for (const [k, d] of Object.entries(edges)) {
  edgeLit[k] = el("path", { d, pathLength: 1, fill: "none", stroke: K.nachoDeep, "stroke-width": 4.5, "stroke-linecap": "round", opacity: 0 }, C);
}
// request / response legs: [from, to, edge, reverse?, kind]
const legs = [
  [6.9, 7.4, "e1", 0, "req"], [7.4, 7.9, "e2", 0, "req"], [7.9, 8.5, "e3", 0, "req"], [8.5, 9.0, "e3", 1, "res"],
  [9.0, 9.7, "e4", 0, "req"], [9.7, 10.3, "e4", 1, "res"], [10.3, 10.8, "e2", 1, "res"], [10.8, 11.3, "e1", 1, "res"]
];
ups.push(t => {
  for (const k of Object.keys(edgeLit)) {
    const mine = legs.filter(l => l[2] === k && t >= l[0]);
    if (!mine.length) { edgeLit[k].setAttribute("opacity", 0); continue; }
    const [a, b, , rev, kind] = mine[mine.length - 1];
    const done = t >= b, p = done ? 1 : eio(seg(t, a, b));
    edgeLit[k].setAttribute("opacity", done ? Math.max(0, 1 - (t - b) / 0.9) : 1);
    edgeLit[k].setAttribute("stroke", kind === "res" ? K.ink : K.nachoDeep);
    edgeLit[k].setAttribute("stroke-dasharray", `${p} 2`);
    edgeLit[k].setAttribute("stroke-dashoffset", rev ? -(1 - p) : 0);
  }
});

// glow behind the new node + expanding ring when the request reaches it
const T = NODE.track;
const glowNew = rect(C, T.x - 6, T.y - 6, T.w + 12, NH + 12, { rx: 18, fill: K.guac, extra: { filter: "url(#glow)", opacity: 0 } });
ups.push(t => glowNew.setAttribute("opacity", .42 * Math.min(seg(t, 8.9, 9.3), 1 - seg(t, 10.2, 10.8)) * (0.8 + 0.2 * Math.sin(t * 9))));
const ring = rect(C, T.x, T.y, T.w, NH, { rx: 14, stroke: K.guac, sw: 3 });
ups.push(t => {
  const p = seg(t, 9.55, 10.15);
  const e = eo(p), grow = 4 + e * 26;
  ring.setAttribute("x", T.x - grow); ring.setAttribute("y", T.y - grow);
  ring.setAttribute("width", T.w + grow * 2); ring.setAttribute("height", NH + grow * 2);
  ring.setAttribute("rx", 14 + grow * .6);
  ring.setAttribute("opacity", p > 0 && p < 1 ? .65 * (1 - p) : 0);
});

const arrivals = { browser: [11.3], gateway: [7.4, 10.8], api: [7.9, 9.0, 10.3], db: [8.5], track: [9.7], ana: [] };
function node(key, state) {
  const n = NODE[key], [name, kind] = STR.nodes[key];
  const grp = g(C), cx = n.x + n.w / 2, cy = n.y + NH / 2;
  const body = rect(grp, n.x, n.y, n.w, NH, { rx: 12, fill: K.paper2, stroke: K.line, sw: 2 });
  const tile = rect(grp, n.x + 12, n.y + 16, 36, 36, { rx: 9, fill: K.paper, stroke: K.line, sw: 1.5 });
  const ic = icon(grp, n.icon, n.x + 30, n.y + 34, 24, K.ink2, 1.9);
  text(grp, n.x + 58, n.y + 31, name, { size: 16, weight: 600, fit: n.w - 66 });
  text(grp, n.x + 58, n.y + 50, kind, { size: 13, weight: 400, fill: K.ink2, fit: n.w - 66 });
  let tag = null;
  if (state) {
    const isNew = state === "new";
    const label = isNew ? STR.isNew : STR.changed;
    const tw = label.length * (lang === "ko" ? 13.5 : 8.4) + 20;
    tag = g(grp);
    rect(tag, n.x + n.w - tw - 8, n.y - 13, tw, 25, { rx: 6, fill: isNew ? K.guac : K.nacho });
    text(tag, n.x + n.w - tw / 2 - 8, n.y + 4.5, label, { size: 13, weight: 700, fill: isNew ? "#fff" : K.onNacho, anchor: "middle" });
  }
  ups.push(t => {
    const p = state ? seg(t, 6.2, 6.7) : 0;
    if (tag) {
      const pp = back(p);
      tag.setAttribute("opacity", Math.min(1, p * 2));
      tag.setAttribute("transform", `translate(${n.x + n.w - 20} ${n.y}) scale(${.6 + .4 * pp}) translate(${-(n.x + n.w - 20)} ${-n.y})`);
    }
    const on = p > .5;
    body.setAttribute("stroke", on ? (state === "new" ? K.guac : K.ink) : K.line);
    body.setAttribute("stroke-width", on ? 3 : 2);
    tile.setAttribute("fill", on ? (state === "new" ? K.guac : K.nacho) : K.paper);
    tile.setAttribute("stroke", on ? "none" : K.line);
    ic.setAttribute("stroke", on ? (state === "new" ? "#fff" : K.onNacho) : K.ink2);
    // a small pulse each time the request reaches this component
    let s = 1;
    for (const a of arrivals[key]) { const q = seg(t, a - .05, a + .4); if (q > 0 && q < 1) s += .045 * Math.sin(Math.PI * q); }
    grp.setAttribute("transform", `translate(${cx} ${cy}) scale(${s}) translate(${-cx} ${-cy})`);
  });
}

const paths = Object.fromEntries(Object.entries(edges).map(([k, d]) => [k, el("path", { d, fill: "none", stroke: "none" }, C)]));
function posAt(t) {
  const leg = legs.find(l => t >= l[0] && t <= l[1]);
  if (!leg) return null;
  const [a, b, k, rev, kind] = leg;
  const p = eio(seg(t, a, b)), pe = paths[k], len = pe.getTotalLength();
  const pt = pe.getPointAtLength(len * (rev ? 1 - p : p));
  return { x: pt.x, y: pt.y, kind, edge: k };
}

const dotCore = el("circle", { r: 8, fill: K.nachoDeep, stroke: K.paper, "stroke-width": 3 }, dot);
ups.push(t => {
  const now = posAt(t);
  dot.setAttribute("opacity", now ? 1 : 0);
  if (now) {
    dot.setAttribute("transform", `translate(${now.x} ${now.y})`);
    const col = now.kind === "res" ? K.ink : K.nachoDeep;
    dotCore.setAttribute("fill", col); dotRing.setAttribute("stroke", col);
    dotRing.setAttribute("r", 14 + 2 * Math.sin(t * 14));
  }
  for (const [i, c] of trail) {
    const pt = posAt(t - i * .045);
    if (now && pt) {
      c.setAttribute("cx", pt.x); c.setAttribute("cy", pt.y);

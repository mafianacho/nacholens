<!--
  Source of docs/images/blackbox-to-whitebox*.gif.
  A pure function of time: window.renderFrame(t) draws the scene at second t (0..DURATION).
  Open it in a browser with ?lang=en or ?lang=ko; ?t=7.5 shows one still frame.
  Frames are captured and encoded by render.mjs (see README.md in this folder).
-->
<style>
  @font-face { font-family: "Nacho Sans"; font-weight: 400; src: url("../../src/player/fonts/nacho-sans-400.woff2") format("woff2"); }
  @font-face { font-family: "Nacho Sans"; font-weight: 500; src: url("../../src/player/fonts/nacho-sans-500.woff2") format("woff2"); }
  @font-face { font-family: "Nacho Sans"; font-weight: 600; src: url("../../src/player/fonts/nacho-sans-600.woff2") format("woff2"); }
  @font-face { font-family: "Nacho Sans"; font-weight: 700; src: url("../../src/player/fonts/nacho-sans-700.woff2") format("woff2"); }
  @font-face { font-family: "Nacho Mono"; font-weight: 500; src: url("../../src/player/fonts/nacho-mono-500.woff2") format("woff2"); }
  @font-face { font-family: "Nacho Mono"; font-weight: 600; src: url("../../src/player/fonts/nacho-mono-600.woff2") format("woff2"); }
  @font-face { font-family: "Anton"; font-weight: 400; src: url("../../src/player/fonts/anton-400.woff2") format("woff2"); }
  html, body { margin: 0; background: #fff; }

  text { font-family: "Nacho Sans", "Noto Sans CJK KR", "Noto Sans CJK JP", sans-serif; }

</style>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"></svg>
<script>
(() => {
const W = 960, H = 540, DURATION = 17.5;   // seconds shown; scene times below are 'scene seconds' (0..15.5)
const lang = new URLSearchParams(location.search).get("lang") === "ko" ? "ko" : "en";

const STR = {
  en: {
    before: "BEFORE", beforeTitle: "AI coding agents are a black box",
    after: "AFTER", afterTitle: "nacholens turns it into a white box",
    you: "You", ask: "Show shipping status\non the order list",
    agent: "AI agent", blackbox: "BLACK BOX",
    files: "23 files changed",
    q1: "What did it touch?", q2: "Any new outside calls?", q3: "What should I re-test?",
    cap: "You can't see inside. Checking 23 files means reading code.",
    legend: "Highlighted from git diff: orange = changed, green = new",
    steps: [
      "Browser asks for the order list",
      "Gateway checks the session",
      "Order API reads the user's orders from SQLite",
      "Order API asks the shipping tracker for each order",
      "Order API builds the reply with the status",
      "Browser shows the list with delivery status"
    ],
    changed: "Changed", isNew: "NEW",
    nodes: { browser: ["Browser", "Client"], gateway: ["Gateway", "Gateway"], api: ["Order API", "Service"],
             db: ["SQLite", "Data store"], track: ["Shipping tracker", "External service"], ana: ["Analytics", "External service"] },
    a1: "2 parts changed, 1 new", s1: "Browser, Order API, Shipping tracker",
    a2: "Yes: Shipping tracker", s2: "One lookup per order",
    a3: "Re-test these 2 flows", s3: "List my orders, Place an order",
    black: "Black box", white: "White box",
    tag1: "See what your AI changed.", tag2: "No code reading needed.",
    tag3: "Pick a use case, watch the request move, see the changed parts.",
    brand: "Made by Mafianacho Inc."
  },
  ko: {
    before: "BEFORE", beforeTitle: "AI 에이전틱 코딩은 블랙박스입니다",
    after: "AFTER", afterTitle: "nacholens가 화이트박스로 바꿉니다",
    you: "나", ask: "주문 목록에\n배송 상태를 보여줘",
    agent: "AI 에이전트", blackbox: "BLACK BOX",
    files: "파일 23개 변경",
    q1: "뭘 건드렸지?", q2: "새 외부 호출은 없나?", q3: "뭘 다시 테스트하지?",
    cap: "안을 볼 수 없습니다. 파일 23개를 확인하려면 코드를 읽어야 합니다.",
    legend: "git diff로 강조: 주황 = 변경, 초록 = 새로 추가",
    steps: [
      "브라우저가 주문 목록을 요청",
      "게이트웨이가 세션을 확인",
      "주문 API가 SQLite에서 주문을 읽음",
      "주문 API가 주문마다 배송 추적기에 문의",
      "주문 API가 배송 상태를 넣어 응답을 만듦",
      "브라우저가 배송 상태와 함께 목록을 표시"
    ],
    changed: "변경", isNew: "신규",
    nodes: { browser: ["브라우저", "클라이언트"], gateway: ["게이트웨이", "게이트웨이"], api: ["주문 API", "서비스"],
             db: ["SQLite", "데이터 저장소"], track: ["배송 추적기", "외부 서비스"], ana: ["분석 도구", "외부 서비스"] },
    a1: "2곳 변경, 1곳 신규", s1: "브라우저, 주문 API, 배송 추적기",
    a2: "있음: 배송 추적기", s2: "주문마다 1회 조회",
    a3: "다시 볼 흐름 2개", s3: "내 주문 보기, 주문하기",
    black: "블랙박스", white: "화이트박스",
    tag1: "AI가 무엇을 바꿨는지 눈으로 확인하세요.", tag2: "코드를 읽을 필요가 없습니다.",
    tag3: "유즈케이스를 고르면 요청이 움직이고 바뀐 곳이 강조됩니다.",
    brand: "Made by Mafianacho Inc."
  }
}[lang];

const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("stage");
const ups = [];                       // per-frame updaters
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = p => 1 - Math.pow(1 - p, 3);
const eio = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const back = p => { const c = 1.9; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const lerp = (a, b, p) => a + (b - a) * p;

function el(tag, attrs = {}, parent = svg) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  parent.appendChild(e);
  return e;
}
function g(parent, attrs = {}) { return el("g", attrs, parent); }
function text(parent, x, y, str, o = {}) {
  const t = el("text", {
    x, y, "font-size": o.size || 16, "font-weight": o.weight || 500, fill: o.fill || "#1a1a1a",
    "text-anchor": o.anchor || "start", ...(o.ls ? { "letter-spacing": o.ls } : {})
  }, parent);
  if (o.cls) t.setAttribute("class", o.cls);
  String(str).split("\n").forEach((line, i) => {
    const s = el("tspan", { x, dy: i === 0 ? 0 : (o.lh || (o.size || 16) * 1.3) }, t);
    s.textContent = line;
  });
  return t;
}
function rect(parent, x, y, w, h, o = {}) {
  return el("rect", { x, y, width: w, height: h, rx: o.rx ?? 0, fill: o.fill || "none", ...(o.stroke ? { stroke: o.stroke, "stroke-width": o.sw || 2 } : {}), ...(o.extra || {}) }, parent);
}
// reveal a group: fade + slide up
function reveal(node, a, b, dy = 10) {
  ups.push(t => {
    const p = eo(seg(t, a, b));
    node.setAttribute("opacity", p);
    node.setAttribute("transform", `translate(0 ${(1 - p) * dy})`);
  });
}
function windowed(node, a, b, f = .12) {
  ups.push(t => node.setAttribute("opacity", Math.min(seg(t, a, a + f), 1 - seg(t, b - f, b))));
}

const defs = el("defs");
const dots = el("pattern", { id: "dots", width: 22, height: 22, patternUnits: "userSpaceOnUse" }, defs);
el("circle", { cx: 2, cy: 2, r: 1.2, fill: "#D9D9D4" }, dots);
const blur = el("filter", { id: "glow", x: "-40%", y: "-60%", width: "180%", height: "220%" }, defs);
el("feGaussianBlur", { stdDeviation: 9 }, blur);
const blurSm = el("filter", { id: "soft", x: "-20%", y: "-20%", width: "140%", height: "140%" }, defs);
el("feGaussianBlur", { stdDeviation: 3 }, blurSm);
const clipA = el("clipPath", { id: "clipA" }, defs);
const clipARect = el("rect", { x: 0, y: 0, width: W, height: H }, clipA);
const boxClip = el("clipPath", { id: "boxClip" }, defs);
el("rect", { x: 344, y: 176, width: 262, height: 160, rx: 14 }, boxClip);

function logo(parent, x, y, dark) {
  const b = g(parent, { transform: `translate(${x} ${y})` });
  rect(b, 0, 0, 30, 30, { rx: 7, fill: "#FFC21A" });
  text(b, 15, 24, "N", { size: 25, anchor: "middle", fill: "#111", cls: "anton", weight: 400 });
  text(b, 40, 24, "NACHOLENS", { size: 25, fill: dark ? "#F2F0EA" : "#1a1a1a", cls: "anton", weight: 400, ls: 1.5 });
}

// ============================================================ scene C (white box, below)
const C = g(svg);
rect(C, 0, 0, W, H, { fill: "#FCFCFA" });
rect(C, 0, 0, W, H, { fill: "url(#dots)" });
rect(C, 0, 0, W, 60, { fill: "#FFFFFF" });
rect(C, 0, 60, W, 1.5, { fill: "#E5E5E0" });
{
  const hp = g(C);
  rect(hp, 32, 15, 84, 30, { rx: 15, fill: "#1F7A3A" });
  text(hp, 74, 36, STR.after, { size: 15, weight: 700, fill: "#fff", anchor: "middle", ls: 1.2 });
  text(hp, 132, 38, STR.afterTitle, { size: 22, weight: 700, fill: "#1a1a1a" });
  logo(C, 720, 15, false);
}

const NODE = {
  browser: { x: 30, y: 220 }, gateway: { x: 232, y: 220 }, api: { x: 434, y: 220 },
  db: { x: 730, y: 125, w: 200 }, track: { x: 730, y: 220, w: 200 }, ana: { x: 730, y: 315, w: 200 }
};
const NW = 160, NH = 64;
const edges = {
  e1: "M190 252 L232 252", e2: "M392 252 L434 252",
  e3: "M594 252 C 665 252 665 157 730 157", e4: "M594 252 L730 252", e5: "M594 252 C 665 252 665 347 730 347"
};
const edgeEls = {};
for (const [k, d] of Object.entries(edges)) {
  el("path", { d, fill: "none", stroke: "#CFCFC8", "stroke-width": 3, "stroke-linecap": "round" }, C);
  edgeEls[k] = el("path", { d, fill: "none", stroke: k === "e4" ? "#1F7A3A" : "#222", "stroke-width": 4, "stroke-linecap": "round", opacity: 0 }, C);
}
const active = (k, a, b) => ups.push(t => edgeEls[k].setAttribute("opacity", t >= a && t <= b ? 1 : 0));
active("e1", 6.9, 7.4); active("e2", 7.4, 7.9); active("e3", 7.9, 9.0); active("e4", 9.0, 10.3); active("e2", 10.3, 10.8); active("e1", 10.8, 11.3);

// glow behind the new node
const glowNew = rect(C, NODE.track.x - 6, NODE.track.y - 6, NODE.track.w + 12, NH + 12, { rx: 18, fill: "#2E9E4F", extra: { filter: "url(#glow)", opacity: 0 } });
ups.push(t => glowNew.setAttribute("opacity", .55 * Math.min(seg(t, 8.9, 9.3), 1 - seg(t, 10.2, 10.8)) * (0.75 + 0.25 * Math.sin(t * 10))));

function node(key, state) {
  const n = NODE[key], [name, kind] = STR.nodes[key], nw = n.w || NW;
  const grp = g(C);
  const body = rect(grp, n.x, n.y, nw, NH, { rx: 12, fill: "#fff", stroke: "#D4D4CE", sw: 2.5 });
  const tile = rect(grp, n.x + 10, n.y + 19, 26, 26, { rx: 7, fill: "#ECECE6" });
  text(grp, n.x + 46, n.y + 31, name, { size: 15.5, weight: 700 });
  text(grp, n.x + 46, n.y + 50, kind, { size: 12, weight: 500, fill: "#6B6B66" });
  if (state) {
    const isNew = state === "new";
    const tagTxt = isNew ? STR.isNew : STR.changed;
    const tw = tagTxt.length * (lang === "ko" ? 13 : 8.2) + 22;
    const tag = g(C);
    rect(tag, n.x + nw - tw - 8, n.y - 13, tw, 25, { rx: 12.5, fill: isNew ? "#1F7A3A" : "#FFE3A3" });
    text(tag, n.x + nw - tw / 2 - 8, n.y + 4.5, tagTxt, { size: 13, weight: 700, fill: isNew ? "#fff" : "#8A4B00", anchor: "middle" });
    ups.push(t => {
      const p = seg(t, 6.2, 6.7);
      tag.setAttribute("opacity", p);
      body.setAttribute("stroke", p > .5 ? (isNew ? "#1F7A3A" : "#222") : "#D4D4CE");
      body.setAttribute("stroke-width", p > .5 ? 3.5 : 2.5);
      body.setAttribute("fill", p > .5 ? (isNew ? "#E6F4E9" : "#FFF3D1") : "#fff");
      tile.setAttribute("fill", p > .5 ? (isNew ? "#2E9E4F" : "#FFC21A") : "#ECECE6");
    });
  }
}
node("browser", "changed"); node("gateway"); node("api", "changed");
node("db"); node("track", "new"); node("ana");

// travelling request dot
const paths = Object.fromEntries(Object.entries(edges).map(([k, d]) => [k, el("path", { d, fill: "none", stroke: "none" }, C)]));
const legs = [
  [6.9, 7.4, "e1", 0], [7.4, 7.9, "e2", 0], [7.9, 8.5, "e3", 0], [8.5, 9.0, "e3", 1],
  [9.0, 9.7, "e4", 0], [9.7, 10.3, "e4", 1], [10.3, 10.8, "e2", 1], [10.8, 11.3, "e1", 1]
];
const dot = g(C);
const dotHalo = el("circle", { r: 15, fill: "#FFC21A", opacity: .35 }, dot);
const dotCore = el("circle", { r: 8.5, fill: "#FFC21A", stroke: "#222", "stroke-width": 2.5 }, dot);
ups.push(t => {
  const leg = legs.find(l => t >= l[0] && t <= l[1]);
  if (!leg) { dot.setAttribute("opacity", 0); return; }
  const [a, b, k, rev] = leg;
  const p = eio(seg(t, a, b)), pe = paths[k], len = pe.getTotalLength();
  const pt = pe.getPointAtLength(len * (rev ? 1 - p : p));
  dot.setAttribute("opacity", 1);
  dot.setAttribute("transform", `translate(${pt.x} ${pt.y})`);
  const green = k === "e4";
  dotCore.setAttribute("fill", green ? "#2E9E4F" : "#FFC21A");
  dotHalo.setAttribute("fill", green ? "#2E9E4F" : "#FFC21A");
});

// caption pill (legend, then steps)
const capX = 150, capW = 660, capY = 74;
const caps = [];
function capPill(label, a, b, o = {}) {
  const grp = g(C, { opacity: 0 });
  rect(grp, capX, capY, capW, 38, { rx: 19, fill: o.fill || "#fff", stroke: o.stroke || "#E0E0DA", sw: 2 });
  if (o.num) {
    el("circle", { cx: capX + 22, cy: capY + 19, r: 13, fill: o.numFill || "#FFC21A" }, grp);
    text(grp, capX + 22, capY + 24.5, o.num, { size: 15, weight: 700, anchor: "middle", fill: o.numText || "#111" });
    text(grp, capX + 46, capY + 25, label, { size: 17, weight: 600, fill: "#1a1a1a" });
  } else {
    text(grp, capX + capW / 2, capY + 25, label, { size: 17, weight: 600, fill: "#1a1a1a", anchor: "middle" });
  }
  windowed(grp, a, b);
  return grp;
}
capPill(STR.legend, 6.3, 6.9, { fill: "#FFF8E1", stroke: "#F0D78A" });
capPill(STR.steps[0], 6.9, 7.4, { num: "1" });
capPill(STR.steps[1], 7.4, 7.9, { num: "2" });
capPill(STR.steps[2], 7.9, 9.0, { num: "3" });
capPill(STR.steps[3], 9.0, 10.3, { num: "4", fill: "#E6F4E9", stroke: "#2E9E4F", numFill: "#1F7A3A", numText: "#fff" });
capPill(STR.steps[4], 10.3, 10.8, { num: "5" });
capPill(STR.steps[5], 10.8, 11.5, { num: "6" });

// the three answers (they answer the three questions of scene A)
const CARD = [
  { x: 32, q: STR.q1, a: STR.a1, s: STR.s1, t: 8.3 },
  { x: 345, q: STR.q2, a: STR.a2, s: STR.s2, t: 9.7 },
  { x: 658, q: STR.q3, a: STR.a3, s: STR.s3, t: 10.4 }
];
CARD.forEach(c => {
  const grp = g(C, { opacity: 0 });
  rect(grp, c.x, 410, 270, 92, { rx: 14, fill: "#fff", stroke: "#E0E0DA", sw: 2 });
  rect(grp, c.x, 410, 6, 92, { rx: 3, fill: "#1F7A3A" });
  text(grp, c.x + 22, 434, c.q, { size: 14, weight: 600, fill: "#6B6B66" });
  text(grp, c.x + 22, 463, c.a, { size: 19, weight: 700, fill: "#1a1a1a" });
  text(grp, c.x + 22, 486, c.s, { size: 13.5, weight: 500, fill: "#6B6B66" });
  el("circle", { cx: c.x + 246, cy: 434, r: 12, fill: "#1F7A3A" }, grp);
  el("path", { d: `M${c.x + 240} 434 l4.5 4.5 l8 -9`, fill: "none", stroke: "#fff", "stroke-width": 3, "stroke-linecap": "round", "stroke-linejoin": "round" }, grp);
  reveal(grp, c.t, c.t + .4, 14);
});

// ============================================================ scene A (black box, above, wiped away)
const A = g(svg, { "clip-path": "url(#clipA)" });
rect(A, 0, 0, W, H, { fill: "#15141A" });
rect(A, 0, 0, W, 60, { fill: "#1D1C23" });
rect(A, 0, 60, W, 1.5, { fill: "#2D2C35" });
{
  rect(A, 32, 15, 98, 30, { rx: 15, fill: "#E5484D" });
  text(A, 81, 36, STR.before, { size: 15, weight: 700, fill: "#fff", anchor: "middle", ls: 1.2 });
  text(A, 146, 38, STR.beforeTitle, { size: 22, weight: 700, fill: "#F2F0EA" });
  logo(A, 720, 15, true);
}
// you + request bubble
{
  const you = g(A);
  el("circle", { cx: 86, cy: 262, r: 29, fill: "#3A3A44" }, you);
  el("circle", { cx: 86, cy: 253, r: 9.5, fill: "#9A9AA6" }, you);
  el("path", { d: "M68 280 q18 -22 36 0", fill: "#9A9AA6" }, you);
  text(you, 86, 316, STR.you, { size: 15, weight: 600, fill: "#B7B4AA", anchor: "middle" });
  reveal(you, .1, .5);
  const bub = g(A);
  rect(bub, 36, 120, 262, 76, { rx: 14, fill: "#F2F0EA" });
  el("path", { d: "M70 196 l12 20 l12 -20 z", fill: "#F2F0EA" }, bub);
  text(bub, 52, 150, STR.ask, { size: 17, weight: 600, fill: "#15141A", lh: 24 });
  reveal(bub, .35, .85, 8);
}
// arrow you -> box with a request packet
el("path", { d: "M130 262 L336 262", stroke: "#4A4A55", "stroke-width": 3, "stroke-dasharray": "2 9", "stroke-linecap": "round" }, A);
{
  const pk = g(A);
  rect(pk, -16, -11, 32, 22, { rx: 5, fill: "#FFC21A" });
  rect(pk, -9, -4, 18, 3, { rx: 1.5, fill: "#15141A" });
  rect(pk, -9, 3, 12, 3, { rx: 1.5, fill: "#15141A" });
  ups.push(t => {
    const p = eio(seg(t, .95, 1.75));
    pk.setAttribute("opacity", Math.min(seg(t, .95, 1.05), 1 - seg(t, 1.7, 1.8)));
    pk.setAttribute("transform", `translate(${lerp(140, 330, p)} 262)`);
  });
}
// the black box
{
  const box = g(A);
  rect(box, 340, 140, 270, 230, { rx: 22, fill: "#000", stroke: "#5A5A66", sw: 3 });
  text(box, 475, 168, STR.agent, { size: 16, weight: 600, fill: "#8B8B95", anchor: "middle" });
  // murky scrolling code lines inside
  const inner = g(box, { "clip-path": "url(#boxClip)" });
  const rows = g(inner);
  const seed = n => { const x = Math.sin(n * 91.7) * 43758.5453; return x - Math.floor(x); };
  for (let i = 0; i < 16; i++) {
    const w = 40 + seed(i + 1) * 170, ind = Math.floor(seed(i + 9) * 3) * 22;
    rect(rows, 360 + ind, 182 + i * 20, w, 8, { rx: 4, fill: "#26252D" });
  }
  ups.push(t => {
    rows.setAttribute("transform", `translate(0 ${-((t * 38) % 40)})`);
    inner.setAttribute("opacity", Math.min(seg(t, 1.6, 2.2), 1 - seg(t, 4.9, 5.4)));
  });
  const q = text(box, 475, 292, "?", { size: 128, anchor: "middle", fill: "#fff", cls: "anton", weight: 400 });
  ups.push(t => {
    q.setAttribute("opacity", seg(t, 1.5, 2.0) * (.6 + .4 * Math.sin(t * 4.2) ** 2));
  });
  text(box, 475, 352, STR.blackbox, { size: 13, weight: 600, fill: "#E5484D", anchor: "middle", ls: 3, cls: "mono" });
  reveal(box, 0, .4, 0);
}
// arrow box -> diff pile
el("path", { d: "M614 262 L690 262", stroke: "#4A4A55", "stroke-width": 3, "stroke-dasharray": "2 9", "stroke-linecap": "round" }, A);
{
  const pk = g(A);
  rect(pk, -14, -10, 28, 20, { rx: 5, fill: "#9A9AA6" });
